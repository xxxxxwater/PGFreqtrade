---
# Binance Portfolio Margin (standard PM) freqtrade deployment.
#
# BEFORE FIRST START:
#   1. cp user_data/config_pm_live.example.json user_data/config_pm_live.json
#      then edit it (dry_run defaults to true - keep it true until you have verified
#      /pm_status, /pm_risk and /pm_recover, then switch to false deliberately).
#   2. cp .env.pm.example .env and fill BINANCE_PM_API_KEY / BINANCE_PM_API_SECRET
#      (keys must be enabled for Binance PM PAPI endpoints).
#   3. The example strategy is user_data/strategies/BtcUsdtPmStrategy.py.
#
# The environment variables below intentionally fail fast when unset so empty env
# vars cannot silently override the config-file credentials.
#
# Pre-flight checks (run from the repo root, using your python env):
#   python scripts/binance_pm_probe.py --all --pretty
#   freqtrade trade --config user_data/config_pm_live.json --dry-run
services:
  freqtrade-pm:
    image: pgresearchchris/pgfreqtrade:pm-binance
    pull_policy: always
    restart: unless-stopped
    container_name: freqtrade-pm
    volumes:
      - "./user_data:/freqtrade/user_data"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - FREQTRADE__EXCHANGE__KEY=${BINANCE_PM_API_KEY:?Set BINANCE_PM_API_KEY in your shell or .env}
      - FREQTRADE__EXCHANGE__SECRET=${BINANCE_PM_API_SECRET:?Set BINANCE_PM_API_SECRET in your shell or .env}
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config_pm_live.json
      --strategy BtcUsdtPmStrategy
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
